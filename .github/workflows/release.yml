name: release
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.sha }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-22.04
    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}
      new_version: ${{ steps.version_check.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version changes
        id: version_check
        shell: bash
        run: |
          latest_release=$(curl -s -H "Authorization: token ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name' | tr -d 'v')
          echo "Latest release version: $latest_release"

          cargo_version=$(grep -m1 '^version\s*=' Cargo.toml | awk -F '"' '{print $2}')
          echo "Cargo version: $cargo_version"

          if [ "$latest_release" != "$cargo_version" ]; then
            echo "Version has changed to $cargo_version"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$cargo_version" >> $GITHUB_OUTPUT
          else
            echo "Version has not changed"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          generate_release_notes: true

  build-release:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.version_changed == 'true'
    name: build-release ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-22.04
            rust: stable
            target: x86_64-unknown-linux-musl
          - build: macos
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin  # cross-compiled on the arm64 runner
          - build: macos-arm64
            os: macos-latest
            rust: stable
            target: aarch64-apple-darwin  # native on the arm64 runner
    env:
      RUST_BACKTRACE: full
      TARGET_DIR: ./target
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build and Package
        shell: bash
        run: |
          scripts/package.sh --target ${{ matrix.target }}
          echo "ASSET=dist/flopha-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV

      - name: Upload release archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          files: ${{ env.ASSET }}
