name: release
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.sha }}
  cancel-in-progress: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      new_version: ${{ steps.version_check.outputs.new_version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        id: version_check
        shell: bash
        run: |
          cargo_version=$(grep -m1 '^version\s*=' Cargo.toml | awk -F '"' '{print $2}')
          echo "new_version=$cargo_version" >> $GITHUB_OUTPUT

          git fetch --tags
          if git tag --list "v${cargo_version}" | grep -q .; then
            echo "Tag v${cargo_version} already published, skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version: $cargo_version"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Install flopha
        if: steps.version_check.outputs.should_release == 'true'
        env:
          FLOPHA_VERSION: latest
        run: bash action/install.sh

      - name: Generate changelog
        id: changelog
        if: steps.version_check.outputs.should_release == 'true'
        shell: bash
        run: |
          prev_tag=$(flopha lv --pattern 'v{major}.{minor}.{patch}' --format json | jq -r '.version // empty')
          CL_ARGS=(--to "v${{ steps.version_check.outputs.new_version }}")
          [ -n "$prev_tag" ] && CL_ARGS+=(--from "$prev_tag")
          CL_EOF="__FLOPHA_CL_${RANDOM}${RANDOM}__"
          {
            echo "changelog<<${CL_EOF}"
            flopha changelog "${CL_ARGS[@]}" \
              --group 'Breaking Changes:^💥' \
              --group 'New Features:^✨' \
              --group 'Bug Fixes:^(🐛|🚑)' \
              --group 'Performance:^⚡' \
              --group 'Refactoring:^♻' \
              --group 'Documentation:^📝'
            echo "${CL_EOF}"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.version_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_check.outputs.new_version }}
          draft: true
          body: ${{ steps.changelog.outputs.changelog }}

  build-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    name: build-release ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-22.04
            rust: stable
            target: x86_64-unknown-linux-musl
          - build: macos
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin  # cross-compiled on the arm64 runner
          - build: macos-arm64
            os: macos-latest
            rust: stable
            target: aarch64-apple-darwin  # native on the arm64 runner
    env:
      RUST_BACKTRACE: full
      TARGET_DIR: ./target
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build and Package
        shell: bash
        run: |
          scripts/package.sh --target ${{ matrix.target }}
          echo "ASSET=dist/flopha-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV

      - name: Upload asset to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.new_version }}
          draft: true
          files: ${{ env.ASSET }}

  publish-release:
    needs: [prepare-release, build-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ needs.prepare-release.outputs.new_version }}" \
            --repo "${{ github.repository }}" \
            --draft=false
