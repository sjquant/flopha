name: release
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      new_version: ${{ steps.version_check.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        id: version_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cargo_version=$(sed -n '/^\[package\]/,/^\[/s/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$cargo_version"
          tag="v${cargo_version}"
          echo "new_version=$cargo_version" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft' || true)" = false ]; then
              echo "Release $tag already published, skipping"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Unfinished release $tag belongs to another commit; rerun its original workflow."
              exit 1
            fi
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version_check.outputs.should_release == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version_check.outputs.should_release == 'true'

      # Build from source until the new release options are available in a published binary.
      - name: Create or recover draft release
        if: steps.version_check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo run --locked -- release --require-version-match

  build-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    name: build-release ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-22.04
            rust: stable
            target: x86_64-unknown-linux-musl
          - build: macos
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin # cross-compiled on the arm64 runner
          - build: macos-arm64
            os: macos-latest
            rust: stable
            target: aarch64-apple-darwin # native on the arm64 runner
    env:
      RUST_BACKTRACE: full
      TARGET_DIR: ./target
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare-release.outputs.new_version }}

      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build and Package
        shell: bash
        run: |
          scripts/package.sh --target ${{ matrix.target }}
          echo "ASSET=dist/flopha-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV

      - name: Upload asset to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.new_version }}
          draft: true
          files: ${{ env.ASSET }}

  publish-release:
    needs: [prepare-release, build-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ needs.prepare-release.outputs.new_version }}" \
            --repo "${{ github.repository }}" \
            --draft=false
