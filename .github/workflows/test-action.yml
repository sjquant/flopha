name: Test action

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'action/**'
      - '.github/workflows/test-action.yml'
      - 'src/**'
      - 'Cargo.toml'
  pull_request:
    paths:
      - 'action.yml'
      - 'action/**'
      - '.github/workflows/test-action.yml'
      - 'src/**'
      - 'Cargo.toml'

concurrency:
  group: test-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── build binary from source (shared by behavior + dry-run via cache) ───────
  build:
    name: Build flopha from source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        env:
          CARGO_INCREMENTAL: '0'
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: flopha-linux
          path: target/release/flopha
          retention-days: 1

  # ── behavior: controlled repos, real assertions ────────────────────────────
  behavior:
    name: Behavior tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download flopha binary
        uses: actions/download-artifact@v4
        with:
          name: flopha-linux
          path: /home/runner/.flopha/bin

      - name: Make binary executable
        run: chmod +x /home/runner/.flopha/bin/flopha

      - name: Add flopha binary to PATH
        run: echo "/home/runner/.flopha/bin" >> "$GITHUB_PATH"

      - name: feat commit → minor bump (auto)
        run: |
          DIR=$(mktemp -d)
          git -C "$DIR" init
          git -C "$DIR" config user.email "ci@test.invalid"
          git -C "$DIR" config user.name "CI"
          git -C "$DIR" commit --allow-empty -m "chore: init"
          git -C "$DIR" tag v1.0.0
          git -C "$DIR" commit --allow-empty -m "feat: add new command"
          TAG=$(cd "$DIR" && flopha next-version --auto)
          [[ "$TAG" == "v1.1.0" ]] || { echo "::error::expected v1.1.0, got $TAG"; exit 1; }

      - name: breaking change → major bump (auto)
        run: |
          DIR=$(mktemp -d)
          git -C "$DIR" init
          git -C "$DIR" config user.email "ci@test.invalid"
          git -C "$DIR" config user.name "CI"
          git -C "$DIR" commit --allow-empty -m "chore: init"
          git -C "$DIR" tag v1.2.3
          git -C "$DIR" commit --allow-empty -m "feat!: redesign API"
          TAG=$(cd "$DIR" && flopha next-version --auto)
          [[ "$TAG" == "v2.0.0" ]] || { echo "::error::expected v2.0.0, got $TAG"; exit 1; }

      - name: custom rule → correct bump
        run: |
          DIR=$(mktemp -d)
          git -C "$DIR" init
          git -C "$DIR" config user.email "ci@test.invalid"
          git -C "$DIR" config user.name "CI"
          git -C "$DIR" commit --allow-empty -m "chore: init"
          git -C "$DIR" tag v1.0.0
          git -C "$DIR" commit --allow-empty -m "[release] new feature"
          TAG=$(cd "$DIR" && flopha next-version --auto --rule 'minor:\[release\]')
          [[ "$TAG" == "v1.1.0" ]] || { echo "::error::expected v1.1.0, got $TAG"; exit 1; }

      - name: pre-release suffix
        run: |
          DIR=$(mktemp -d)
          git -C "$DIR" init
          git -C "$DIR" config user.email "ci@test.invalid"
          git -C "$DIR" config user.name "CI"
          git -C "$DIR" commit --allow-empty -m "chore: init"
          git -C "$DIR" tag v1.0.0
          git -C "$DIR" commit --allow-empty -m "fix: small patch"
          TAG=$(cd "$DIR" && flopha next-version --pre rc)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || {
            echo "::error::expected rc pre-release tag, got $TAG"; exit 1
          }

  # ── dry-run: verify action wiring (env vars, outputs, install) ─────────────
  dry-run:
    name: Dry-run (action wiring)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download flopha binary
        uses: actions/download-artifact@v4
        with:
          name: flopha-linux
          path: /home/runner/.flopha/bin

      - name: Make binary executable
        run: chmod +x /home/runner/.flopha/bin/flopha

      - name: Add flopha binary to PATH
        run: echo "/home/runner/.flopha/bin" >> "$GITHUB_PATH"

      - name: Run flopha (dry-run)
        id: flopha
        uses: ./
        with:
          auto: true
          dry-run: true

      - name: Assert outputs are set and well-formed
        shell: bash
        run: |
          TAG="${{ steps.flopha.outputs.tag }}"
          VER="${{ steps.flopha.outputs.version }}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::bad tag: $TAG"; exit 1; }
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::bad version: $VER"; exit 1; }

  # ── install script ─────────────────────────────────────────────────────────
  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run install script
        shell: bash
        env:
          FLOPHA_VERSION: latest
        run: bash action/install.sh

      - name: Verify binary
        shell: bash
        run: flopha --version

  # ── pinned version install ─────────────────────────────────────────────────
  install-pinned:
    name: Install (pinned v0.3.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run install script with pinned version
        shell: bash
        env:
          FLOPHA_VERSION: v0.3.0
        run: bash action/install.sh

      - name: Verify binary version
        shell: bash
        run: flopha --version
