#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.21.2"
hooks = [
  { id = "gitleaks" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "gitmoji",
    name = "gitmoji commit message",
    language = "system",
    entry = ".prek/check-gitmoji.sh",
    stages = ["commit-msg"],
    always_run = true,
  },
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --tests -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
  },
]
